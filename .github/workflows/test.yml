name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register checked-out tap
        run: |
          brew tap Mbauro/tap "$GITHUB_WORKSPACE"
          brew trust --formula Mbauro/tap/age-of-agents-hooks
      - run: brew install Mbauro/tap/age-of-agents-hooks
      - run: brew test Mbauro/tap/age-of-agents-hooks
      - run: brew audit --strict Mbauro/tap/age-of-agents-hooks
